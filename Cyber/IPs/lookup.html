<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Lookup — ip_ultimate.db</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
  :root {
    --bg:       #0a0c10;
    --bg2:      #111318;
    --bg3:      #181b22;
    --border:   #2a2d35;
    --border2:  #3a3d48;
    --text:     #e2e4ea;
    --text2:    #8b909e;
    --text3:    #555a68;
    --accent:   #4f9fff;
    --accent2:  #2d6fd4;
    --green:    #3ddc84;
    --red:      #ff5f5f;
    --yellow:   #f5c542;
    --purple:   #b07fff;
    --teal:     #3ddcbb;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --font-ui:   'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; overflow-x: hidden; }

  /* ── Layout ── */
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  .logo { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
  .logo span { color: var(--text2); }
  .topbar-spacer { flex: 1; }
  .db-status { font-size: 12px; font-family: var(--font-mono); }
  .db-status.loaded { color: var(--green); }
  .db-status.none   { color: var(--text3); }

  .main { display: grid; grid-template-columns: 280px 1fr; height: 100%; overflow: hidden; }
  .sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto; overflow-x: hidden;
  }
  .content { display: flex; flex-direction: column; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar-section { padding: 14px 16px 10px; }
  .sidebar-section + .sidebar-section { border-top: 1px solid var(--border); }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }

  .upload-zone {
    border: 1px dashed var(--border2);
    border-radius: 8px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(79,159,255,.05); }
  .upload-zone.drag  { border-color: var(--accent); background: rgba(79,159,255,.08); }
  .upload-zone .icon { font-size: 22px; margin-bottom: 6px; }
  .upload-zone p { font-size: 12px; color: var(--text2); }
  .upload-zone small { font-size: 11px; color: var(--text3); }
  #file-input { display: none; }

  .db-info { background: var(--bg3); border-radius: 6px; padding: 10px 12px; font-family: var(--font-mono); font-size: 11px; }
  .db-info-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .db-info-row:last-child { margin-bottom: 0; }
  .db-info-key { color: var(--text2); }
  .db-info-val { color: var(--text); font-weight: 500; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px; color: var(--text2);
    transition: background .15s, color .15s;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: rgba(79,159,255,.12); color: var(--accent); }
  .nav-item .ni-icon { font-size: 15px; width: 18px; text-align: center; }
  .nav-item .ni-badge {
    margin-left: auto; font-size: 10px; font-family: var(--font-mono);
    background: var(--bg3); border-radius: 4px; padding: 1px 5px; color: var(--text3);
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat-card {
    background: var(--bg3); border-radius: 6px; padding: 8px 10px;
    border: 1px solid var(--border);
  }
  .stat-card .sc-val { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--accent); }
  .stat-card .sc-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* ── Content ── */
  .tab-header {
    display: flex; align-items: center; gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    padding: 0 20px;
  }
  .tab-btn {
    padding: 14px 16px; font-size: 13px; color: var(--text2);
    border: none; background: transparent; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .15s, border-color .15s;
    font-family: var(--font-mono);
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
  .tab-content.active { display: block; }

  /* ── Search bar ── */
  .search-wrap { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-input {
    flex: 1; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: var(--font-mono); font-size: 14px; outline: none;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }
  .btn {
    background: var(--accent2); color: #fff; border: none;
    border-radius: 8px; padding: 10px 18px; cursor: pointer;
    font-size: 13px; font-family: var(--font-mono); font-weight: 600;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--accent); }
  .btn:active { transform: scale(.97); }
  .btn.ghost {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    font-family: var(--font-mono); font-size: 11px;
    padding: 4px 9px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text2);
    cursor: pointer; background: var(--bg2);
    transition: border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Result card ── */
  .result-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 12px;
    animation: fadein .2s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .rc-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }
  .rc-ip { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--text); }
  .rc-int { font-family: var(--font-mono); font-size: 11px; color: var(--text3); margin-top: 1px; }
  .rc-badges { display: flex; gap: 6px; margin-left: auto; }
  .badge {
    font-size: 11px; font-family: var(--font-mono); font-weight: 600;
    padding: 3px 8px; border-radius: 4px; letter-spacing: .04em;
  }
  .badge-green  { background: rgba(61,220,132,.15); color: var(--green); border: 1px solid rgba(61,220,132,.3); }
  .badge-red    { background: rgba(255,95,95,.15);  color: var(--red);   border: 1px solid rgba(255,95,95,.3); }
  .badge-yellow { background: rgba(245,197,66,.15); color: var(--yellow);border: 1px solid rgba(245,197,66,.3); }
  .badge-blue   { background: rgba(79,159,255,.15); color: var(--accent);border: 1px solid rgba(79,159,255,.3); }
  .badge-purple { background: rgba(176,127,255,.15);color: var(--purple);border: 1px solid rgba(176,127,255,.3); }

  .rc-body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .rc-section { padding: 14px 16px; border-right: 1px solid var(--border); }
  .rc-section:last-child { border-right: none; }
  .rc-section-title { font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
  .rc-row { display: flex; flex-direction: column; margin-bottom: 8px; }
  .rc-row:last-child { margin-bottom: 0; }
  .rc-key { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
  .rc-val { font-family: var(--font-mono); font-size: 12px; color: var(--text); word-break: break-all; }
  .rc-val.accent  { color: var(--accent); }
  .rc-val.green   { color: var(--green); }
  .rc-val.red     { color: var(--red); }
  .rc-val.yellow  { color: var(--yellow); }
  .rc-val.purple  { color: var(--purple); }
  .rc-val.teal    { color: var(--teal); }

  .rc-sql {
    padding: 10px 16px; background: var(--bg);
    border-top: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px; color: var(--text3);
  }
  .rc-sql .sql-kw { color: var(--purple); }
  .rc-sql .sql-num { color: var(--yellow); }

  .flag-big { font-size: 28px; line-height: 1; }

  /* ── Table ── */
  .data-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
  .data-table th {
    text-align: left; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text3); font-weight: 600; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase;
    background: var(--bg2); position: sticky; top: 0;
  }
  .data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .data-table tr:hover td { background: var(--bg3); }
  .data-table tr:last-child td { border-bottom: none; }

  /* ── Map placeholder ── */
  .map-wrap { position: relative; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  #map { height: 380px; }

  /* ── Batch ── */
  .batch-textarea {
    width: 100%; min-height: 120px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text);
    font-family: var(--font-mono); font-size: 13px; outline: none;
    resize: vertical; transition: border-color .2s; margin-bottom: 10px;
  }
  .batch-textarea:focus { border-color: var(--accent); }

  /* ── Misc ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }

  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-bar {
    background: rgba(255,95,95,.1); border: 1px solid rgba(255,95,95,.3);
    border-radius: 8px; padding: 10px 14px; color: var(--red);
    font-family: var(--font-mono); font-size: 12px; margin-bottom: 12px;
  }

  .ping-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .progress-bar { background: var(--bg3); border-radius: 4px; overflow: hidden; height: 4px; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }

  .latlon-link { color: var(--teal); text-decoration: none; font-family: var(--font-mono); font-size: 12px; }
  .latlon-link:hover { text-decoration: underline; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
</style>
</head>
<body>
<div class="app">

  <!-- ── Topbar ── -->
  <div class="topbar">
    <div class="logo">IP<span>/</span>LOOKUP <span style="color:var(--text3);font-weight:400">ultimate</span></div>
    <div id="db-status" class="db-status none">no database loaded</div>
    <div class="topbar-spacer"></div>
    <div id="ping-wrap" style="display:none;align-items:center;gap:6px;font-size:12px;color:var(--text2)">
      <div class="ping-dot"></div> live
    </div>
  </div>

  <div class="main">
    <!-- ── Sidebar ── -->
    <div class="sidebar">

      <div class="sidebar-section">
        <div class="sidebar-label">Base de données</div>
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
          <div class="icon">🗄️</div>
          <p>Charger ip_ultimate.db</p>
          <small>ou glisser-déposer</small>
        </div>
        <input type="file" id="file-input" accept=".db,.sqlite,.sqlite3">
        <div id="db-info-wrap" style="display:none;margin-top:10px">
          <div class="db-info" id="db-info"></div>
          <div class="progress-bar" id="load-progress" style="display:none"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Navigation</div>
        <div class="nav-item active" data-tab="lookup" onclick="switchTab('lookup',this)">
          <span class="ni-icon">🔍</span> Lookup IP
        </div>
        <div class="nav-item" data-tab="batch" onclick="switchTab('batch',this)">
          <span class="ni-icon">📋</span> Batch
          <span class="ni-badge">multi</span>
        </div>
        <div class="nav-item" data-tab="explorer" onclick="switchTab('explorer',this)">
          <span class="ni-icon">🌍</span> Explorer
        </div>
        <div class="nav-item" data-tab="stats" onclick="switchTab('stats',this)">
          <span class="ni-icon">📊</span> Stats DB
        </div>
        <div class="nav-item" data-tab="query" onclick="switchTab('query',this)">
          <span class="ni-icon">⚡</span> SQL Query
        </div>
      </div>

      <div class="sidebar-section" id="db-stats-side" style="display:none">
        <div class="sidebar-label">Résumé</div>
        <div class="stat-grid" id="stat-grid"></div>
      </div>

    </div>

    <!-- ── Content ── -->
    <div class="content">
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('lookup',null,'lookup')">Lookup</button>
        <button class="tab-btn" onclick="switchTab('batch',null,'batch')">Batch</button>
        <button class="tab-btn" onclick="switchTab('explorer',null,'explorer')">Explorer</button>
        <button class="tab-btn" onclick="switchTab('stats',null,'stats')">Stats</button>
        <button class="tab-btn" onclick="switchTab('query',null,'query')">SQL</button>
      </div>

      <!-- ── Tab: Lookup ── -->
      <div class="tab-content active" id="tab-lookup">
        <div class="search-wrap">
          <input class="search-input" id="ip-input" placeholder="Entrer une IP  ex: 8.8.8.8" autocomplete="off" spellcheck="false">
          <button class="btn" onclick="doLookup()">Lookup →</button>
        </div>
        <div class="chips" id="example-chips">
          <span style="font-size:11px;color:var(--text3);align-self:center">exemples :</span>
        </div>
        <div id="lookup-result"></div>
      </div>

      <!-- ── Tab: Batch ── -->
      <div class="tab-content" id="tab-batch">
        <textarea class="batch-textarea" id="batch-input" placeholder="Une IP par ligne :&#10;8.8.8.8&#10;1.1.1.1&#10;185.220.101.1&#10;52.94.236.248"></textarea>
        <div style="display:flex;gap:8px;margin-bottom:16px">
          <button class="btn" onclick="doBatch()">Analyser tout →</button>
          <button class="btn ghost" onclick="document.getElementById('batch-input').value=''">Vider</button>
        </div>
        <div id="batch-result"></div>
      </div>

      <!-- ── Tab: Explorer ── -->
      <div class="tab-content" id="tab-explorer">
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          <button class="btn ghost" onclick="exploreQuery('tor')">🔴 TOR Exit Nodes</button>
          <button class="btn ghost" onclick="exploreQuery('vpn')">🟡 VPN Commerciaux</button>
          <button class="btn ghost" onclick="exploreQuery('dch')">🔵 Datacenters</button>
          <button class="btn ghost" onclick="exploreQuery('countries')">🌍 Top pays</button>
          <button class="btn ghost" onclick="exploreQuery('asn')">🏢 Top opérateurs</button>
          <button class="btn ghost" onclick="exploreQuery('threats')">⚠️ Menaces</button>
        </div>
        <div id="explorer-result"></div>
      </div>

      <!-- ── Tab: Stats ── -->
      <div class="tab-content" id="tab-stats">
        <div id="stats-result">
          <div class="empty-state">
            <div class="es-icon">📊</div>
            <p>Charge une base de données pour voir les statistiques</p>
          </div>
        </div>
      </div>

      <!-- ── Tab: SQL ── -->
      <div class="tab-content" id="tab-query">
        <div class="search-wrap" style="flex-direction:column;gap:8px">
          <textarea class="batch-textarea" id="sql-input" style="min-height:80px" placeholder="SELECT * FROM view_ip_full WHERE is_tor = 1 LIMIT 20"></textarea>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="runSQL()">Exécuter ⚡</button>
            <button class="btn ghost" onclick="setSQLExample('tor')">TOR</button>
            <button class="btn ghost" onclick="setSQLExample('top_countries')">Top pays</button>
            <button class="btn ghost" onclick="setSQLExample('aws')">AWS/Cloud</button>
            <button class="btn ghost" onclick="setSQLExample('full')">Vue complète</button>
          </div>
        </div>
        <div id="sql-result"></div>
      </div>

    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let DB = null;
let SQL = null;
let dbStats = {};

const EXAMPLES = [
  '8.8.8.8', '1.1.1.1', '185.220.101.1', '52.94.236.248',
  '104.21.0.1', '45.33.32.156', '193.0.6.139', '91.108.4.1'
];

const SQL_EXAMPLES = {
  tor: `SELECT ip_from_str, ip_to_str, country_name, city, isp, threat\nFROM view_ip_full\nWHERE is_tor = 1\nLIMIT 50;`,
  top_countries: `SELECT country_code, country_name, COUNT(*) as nb_plages\nFROM ip_ranges\nGROUP BY country_code\nORDER BY nb_plages DESC\nLIMIT 20;`,
  aws: `SELECT ip_from_str, ip_to_str, as_name, country_name, city\nFROM view_ip_full\nWHERE as_name LIKE '%Amazon%' OR as_name LIKE '%Microsoft%' OR as_name LIKE '%Google%'\nLIMIT 50;`,
  full: `SELECT ip_from_str, ip_to_str, country_code, city, asn, as_name,\n       proxy_type, is_vpn, is_tor, is_datacenter\nFROM view_ip_full\nLIMIT 100;`,
};

// ── Init sql.js ────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  try {
    SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
  } catch(e) {
    showError('tab-lookup', 'Impossible de charger sql.js : ' + e.message);
  }

  // Exemples chips
  const chips = document.getElementById('example-chips');
  EXAMPLES.forEach(ip => {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = ip;
    c.onclick = () => { document.getElementById('ip-input').value = ip; doLookup(); };
    chips.appendChild(c);
  });

  // Drag & drop
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); loadFile(e.dataTransfer.files[0]); });
  document.getElementById('file-input').onchange = e => loadFile(e.target.files[0]);

  document.getElementById('ip-input').addEventListener('keydown', e => { if(e.key==='Enter') doLookup(); });
});

// ── Load DB ────────────────────────────────────────────────────────────────────
function loadFile(file) {
  if (!file) return;
  if (!SQL) { alert('sql.js pas encore prêt, réessaie dans 1 seconde.'); return; }

  const prog = document.getElementById('load-progress');
  const fill = document.getElementById('progress-fill');
  prog.style.display = 'block';
  fill.style.width = '30%';

  document.getElementById('db-status').textContent = 'Chargement...';
  document.getElementById('db-status').className = 'db-status';

  const reader = new FileReader();
  reader.onprogress = e => { if(e.lengthComputable) fill.style.width = (30 + 60 * e.loaded/e.total) + '%'; };
  reader.onload = e => {
    fill.style.width = '95%';
    try {
      const arr = new Uint8Array(e.target.result);
      DB = new SQL.Database(arr);
      fill.style.width = '100%';
      setTimeout(() => prog.style.display = 'none', 500);
      onDBLoaded(file.name, file.size);
    } catch(err) {
      prog.style.display = 'none';
      showError('tab-lookup', 'Erreur lecture DB : ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function onDBLoaded(name, size) {
  document.getElementById('db-status').innerHTML =
    '<span class="ping-dot" style="margin-right:6px"></span>' + name;
  document.getElementById('db-status').className = 'db-status loaded';
  document.getElementById('ping-wrap').style.display = 'flex';

  // Compte les tables
  const tables = ['ip_ranges','ip_asn','ip_proxy','cities_i18n','countries'];
  const counts = {};
  tables.forEach(t => {
    try { counts[t] = DB.exec(`SELECT COUNT(*) FROM ${t}`)[0]?.values[0][0] ?? 0; } catch { counts[t] = 0; }
  });
  dbStats = counts;

  // DB info
  const info = document.getElementById('db-info');
  info.innerHTML = `
    <div class="db-info-row"><span class="db-info-key">fichier</span><span class="db-info-val">${name}</span></div>
    <div class="db-info-row"><span class="db-info-key">taille</span><span class="db-info-val">${(size/1048576).toFixed(1)} MB</span></div>
    <div class="db-info-row"><span class="db-info-key">ip_ranges</span><span class="db-info-val">${(counts.ip_ranges||0).toLocaleString()}</span></div>
    <div class="db-info-row"><span class="db-info-key">ip_proxy</span><span class="db-info-val">${(counts.ip_proxy||0).toLocaleString()}</span></div>
  `;
  document.getElementById('db-info-wrap').style.display = 'block';

  // Stat grid sidebar
  const grid = document.getElementById('stat-grid');
  const sg = [
    ['ip_ranges','Plages IP'],['ip_asn','ASN'],
    ['ip_proxy','Proxies'],['countries','Pays']
  ];
  grid.innerHTML = sg.map(([k,l]) => `
    <div class="stat-card">
      <div class="sc-val">${fmtNum(counts[k]||0)}</div>
      <div class="sc-lbl">${l}</div>
    </div>`).join('');
  document.getElementById('db-stats-side').style.display = 'block';

  // Load stats tab
  loadStats();
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function ipToInt(ip) {
  const p = ip.trim().split('.');
  if (p.length !== 4) return null;
  return ((+p[0])*16777216 + (+p[1])*65536 + (+p[2])*256 + (+p[3])) >>> 0;
}
function intToIp(n) {
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}
function flag(cc) {
  if (!cc || cc.length!==2) return '';
  try { return String.fromCodePoint(...[...cc.toUpperCase()].map(c=>c.charCodeAt(0)+127397)); } catch { return ''; }
}
function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(0)+'k';
  return n.toString();
}
function showError(tabId, msg) {
  document.getElementById(tabId).innerHTML = `<div class="error-bar">✗ ${msg}</div>`;
}
function requireDB(tabId) {
  if (!DB) {
    document.getElementById(tabId).innerHTML = `
      <div class="empty-state">
        <div class="es-icon">🗄️</div>
        <p>Charge d'abord ta base <strong>ip_ultimate.db</strong><br>en cliquant sur le panneau gauche</p>
      </div>`;
    return false;
  }
  return true;
}

function switchTab(name, sideEl, tabBtnName) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (sideEl) sideEl.classList.add('active');
  else document.querySelectorAll('.nav-item').forEach(n => { if(n.dataset.tab===name) n.classList.add('active'); });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (tabBtnName) document.querySelectorAll('.tab-btn').forEach(b => { if(b.textContent.toLowerCase().includes(tabBtnName.substring(0,4))) b.classList.add('active'); });
}

// ── Lookup ─────────────────────────────────────────────────────────────────────
function doLookup() {
  const ip = document.getElementById('ip-input').value.trim();
  if (!ip) return;
  if (!requireDB('lookup-result')) return;

  const n = ipToInt(ip);
  if (n === null) {
    document.getElementById('lookup-result').innerHTML = `<div class="error-bar">IP invalide : ${ip}</div>`;
    return;
  }

  document.getElementById('lookup-result').innerHTML = '<div style="padding:20px;color:var(--text3)"><span class="spinner"></span> lookup en cours...</div>';

  setTimeout(() => {
    try {
      // Geo
      let geo = null;
      try {
        const r = DB.exec(`SELECT * FROM view_ip_full WHERE ip_from <= ${n} AND ip_to >= ${n} LIMIT 1`);
        if (r.length) geo = Object.fromEntries(r[0].columns.map((c,i) => [c, r[0].values[0][i]]));
      } catch {}
      if (!geo) {
        try {
          const r = DB.exec(`SELECT * FROM ip_ranges WHERE ip_from <= ${n} AND ip_to >= ${n} LIMIT 1`);
          if (r.length) geo = Object.fromEntries(r[0].columns.map((c,i) => [c, r[0].values[0][i]]));
        } catch {}
      }

      let asn = null;
      try {
        const r = DB.exec(`SELECT * FROM ip_asn WHERE ip_from <= ${n} AND ip_to >= ${n} LIMIT 1`);
        if (r.length) asn = Object.fromEntries(r[0].columns.map((c,i) => [c, r[0].values[0][i]]));
      } catch {}

      let proxy = null;
      try {
        const r = DB.exec(`SELECT * FROM ip_proxy WHERE ip_from <= ${n} AND ip_to >= ${n} LIMIT 1`);
        if (r.length) proxy = Object.fromEntries(r[0].columns.map((c,i) => [c, r[0].values[0][i]]));
      } catch {}

      renderResult(ip, n, geo, asn, proxy);
    } catch(e) {
      document.getElementById('lookup-result').innerHTML = `<div class="error-bar">Erreur : ${e.message}</div>`;
    }
  }, 30);
}

function renderResult(ip, ipInt, geo, asn, proxy) {
  if (!geo) {
    document.getElementById('lookup-result').innerHTML = `
      <div class="error-bar">IP ${ip} non trouvée dans la base (plage inconnue)</div>`;
    return;
  }

  const cc      = geo.country_code || '';
  const cn      = geo.country_name || '—';
  const region  = geo.region || '—';
  const city    = geo.city || '—';
  const lat     = geo.latitude ?? null;
  const lon     = geo.longitude ?? null;
  const zip     = geo.zip_code || '—';
  const tz      = geo.timezone || '—';
  const ipFrom  = geo.ip_from_str || (geo.ip_from ? intToIp(geo.ip_from) : '—');
  const ipTo    = geo.ip_to_str   || (geo.ip_to   ? intToIp(geo.ip_to)   : '—');

  const asnNum  = asn?.asn     || geo.asn     || '—';
  const asnName = asn?.as_name || geo.as_name || '—';
  const cidr    = asn?.cidr    || geo.cidr    || '—';

  const ptype   = proxy?.proxy_type || geo.proxy_type || null;
  const usage   = proxy?.usage_type || geo.usage_type || '—';
  const threat  = proxy?.threat     || geo.threat     || '—';
  const isp     = proxy?.isp        || geo.isp        || '—';
  const provider= proxy?.provider   || geo.provider   || '—';

  const isVPN = ptype === 'VPN';
  const isTOR = ptype === 'TOR';
  const isDCH = ptype === 'DCH';

  let statusBadge = `<span class="badge badge-green">✓ CLEAN</span>`;
  if (isTOR) statusBadge = `<span class="badge badge-red">TOR EXIT</span>`;
  else if (isVPN) statusBadge = `<span class="badge badge-yellow">VPN</span>`;
  else if (isDCH) statusBadge = `<span class="badge badge-blue">DATACENTER</span>`;
  else if (ptype) statusBadge = `<span class="badge badge-purple">${ptype}</span>`;

  const latLon = (lat !== null && lon !== null)
    ? `<a class="latlon-link" href="https://maps.google.com/?q=${lat},${lon}" target="_blank">${lat}, ${lon} ↗</a>`
    : '—';

  const sql = `<span class="sql-kw">SELECT</span> * <span class="sql-kw">FROM</span> view_ip_full <span class="sql-kw">WHERE</span> ip_from &lt;= <span class="sql-num">${ipInt}</span> <span class="sql-kw">AND</span> ip_to &gt;= <span class="sql-num">${ipInt}</span>;`;

  document.getElementById('lookup-result').innerHTML = `
    <div class="result-card">
      <div class="rc-header">
        <div class="flag-big">${flag(cc)}</div>
        <div>
          <div class="rc-ip">${ip}</div>
          <div class="rc-int">int: ${ipInt} &nbsp;|&nbsp; range: ${ipFrom} → ${ipTo}</div>
        </div>
        <div class="rc-badges">
          ${statusBadge}
          ${asnName !== '—' ? `<span class="badge badge-blue">${asnNum}</span>` : ''}
        </div>
      </div>
      <div class="rc-body">
        <div class="rc-section">
          <div class="rc-section-title">Géolocalisation</div>
          <div class="rc-row"><div class="rc-key">Pays</div><div class="rc-val accent">${flag(cc)} ${cn} (${cc})</div></div>
          <div class="rc-row"><div class="rc-key">Région</div><div class="rc-val">${region}</div></div>
          <div class="rc-row"><div class="rc-key">Ville</div><div class="rc-val">${city}</div></div>
          <div class="rc-row"><div class="rc-key">Lat / Lon</div><div class="rc-val">${latLon}</div></div>
          <div class="rc-row"><div class="rc-key">Code postal</div><div class="rc-val">${zip}</div></div>
          <div class="rc-row"><div class="rc-key">Timezone</div><div class="rc-val teal">${tz}</div></div>
        </div>
        <div class="rc-section">
          <div class="rc-section-title">Réseau / ASN</div>
          <div class="rc-row"><div class="rc-key">ASN</div><div class="rc-val purple">${asnNum}</div></div>
          <div class="rc-row"><div class="rc-key">Opérateur</div><div class="rc-val">${asnName}</div></div>
          <div class="rc-row"><div class="rc-key">CIDR</div><div class="rc-val">${cidr}</div></div>
          <div class="rc-row"><div class="rc-key">ISP</div><div class="rc-val">${isp}</div></div>
        </div>
        <div class="rc-section">
          <div class="rc-section-title">Sécurité / Proxy</div>
          <div class="rc-row"><div class="rc-key">Type</div><div class="rc-val ${isTOR?'red':isVPN?'yellow':isDCH?'accent':'green'}">${ptype || '✓ clean'}</div></div>
          <div class="rc-row"><div class="rc-key">Usage</div><div class="rc-val">${usage}</div></div>
          <div class="rc-row"><div class="rc-key">Menace</div><div class="rc-val ${threat!=='—'?'red':''}">${threat}</div></div>
          <div class="rc-row"><div class="rc-key">Provider</div><div class="rc-val">${provider}</div></div>
          <div class="rc-row"><div class="rc-key">is_vpn</div><div class="rc-val ${isVPN?'yellow':'green'}">${isVPN?'true':'false'}</div></div>
          <div class="rc-row"><div class="rc-key">is_tor</div><div class="rc-val ${isTOR?'red':'green'}">${isTOR?'true':'false'}</div></div>
          <div class="rc-row"><div class="rc-key">is_datacenter</div><div class="rc-val ${isDCH?'accent':'green'}">${isDCH?'true':'false'}</div></div>
        </div>
      </div>
      <div class="rc-sql">${sql}</div>
    </div>`;
}

// ── Batch ──────────────────────────────────────────────────────────────────────
function doBatch() {
  if (!requireDB('batch-result')) return;
  const raw = document.getElementById('batch-input').value.trim();
  if (!raw) return;
  const ips = [...new Set(raw.split('\n').map(l=>l.trim()).filter(Boolean))];

  document.getElementById('batch-result').innerHTML = '<div style="color:var(--text3)"><span class="spinner"></span> analyse de ' + ips.length + ' IPs...</div>';

  setTimeout(() => {
    const rows = ips.map(ip => {
      const n = ipToInt(ip);
      if (n === null) return { ip, error: true };
      let geo = null, proxy = null, asn = null;
      try {
        const r = DB.exec(`SELECT * FROM view_ip_full WHERE ip_from<=${n} AND ip_to>=${n} LIMIT 1`);
        if (r.length) geo = Object.fromEntries(r[0].columns.map((c,i)=>[c,r[0].values[0][i]]));
      } catch {}
      if (!geo) {
        try {
          const r = DB.exec(`SELECT * FROM ip_ranges WHERE ip_from<=${n} AND ip_to>=${n} LIMIT 1`);
          if (r.length) geo = Object.fromEntries(r[0].columns.map((c,i)=>[c,r[0].values[0][i]]));
        } catch {}
      }
      return { ip, n, geo, asn, proxy };
    });

    const html = `
      <table class="data-table">
        <thead><tr>
          <th>IP</th><th>Pays</th><th>Région</th><th>Ville</th>
          <th>ASN / Opérateur</th><th>Proxy</th>
        </tr></thead>
        <tbody>
        ${rows.map(r => {
          if (r.error) return `<tr><td style="color:var(--red)">${r.ip}</td><td colspan="5" style="color:var(--text3)">IP invalide</td></tr>`;
          const g = r.geo || {};
          const cc = g.country_code || '';
          const pt = g.proxy_type || '';
          const proxyHtml = pt
            ? `<span class="badge ${pt==='TOR'?'badge-red':pt==='VPN'?'badge-yellow':'badge-blue'}">${pt}</span>`
            : '<span style="color:var(--green);font-size:11px">✓ clean</span>';
          const asnTxt = [g.asn, g.as_name].filter(Boolean).join(' — ') || '—';
          return `<tr>
            <td style="color:var(--accent);font-family:var(--font-mono)">${r.ip}</td>
            <td>${flag(cc)} ${g.country_name||'—'}</td>
            <td>${g.region||'—'}</td>
            <td>${g.city||'—'}</td>
            <td style="font-size:11px">${asnTxt}</td>
            <td>${proxyHtml}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>`;
    document.getElementById('batch-result').innerHTML = `
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${ips.length} IPs analysées</div>
      ${html}`;
  }, 30);
}

// ── Explorer ───────────────────────────────────────────────────────────────────
function exploreQuery(type) {
  if (!requireDB('explorer-result')) return;
  document.getElementById('explorer-result').innerHTML = '<span class="spinner"></span>';

  const queries = {
    tor:       [`TOR Exit Nodes`, `SELECT ip_from, ip_to, country_name, city, isp, threat FROM ip_proxy WHERE proxy_type='TOR' LIMIT 100`],
    vpn:       [`VPN Commerciaux`, `SELECT ip_from, ip_to, country_name, city, provider, isp FROM ip_proxy WHERE proxy_type='VPN' LIMIT 100`],
    dch:       [`Datacenters`, `SELECT ip_from, ip_to, country_name, city, isp, as_name FROM ip_proxy p LEFT JOIN ip_asn a ON a.ip_from<=p.ip_from AND a.ip_to>=p.ip_from WHERE proxy_type='DCH' LIMIT 100`],
    countries: [`Top pays par plages IP`, `SELECT country_code, country_name, COUNT(*) as nb FROM ip_ranges GROUP BY country_code ORDER BY nb DESC LIMIT 50`],
    asn:       [`Top opérateurs`, `SELECT asn, as_name, COUNT(*) as nb FROM ip_asn GROUP BY asn ORDER BY nb DESC LIMIT 50`],
    threats:   [`Menaces connues`, `SELECT ip_from, ip_to, country_name, city, proxy_type, threat, isp FROM ip_proxy WHERE threat IS NOT NULL AND threat != '' AND threat != '-' LIMIT 100`],
  };

  const [title, sql] = queries[type] || ['', ''];

  setTimeout(() => {
    try {
      const res = DB.exec(sql);
      if (!res.length) {
        document.getElementById('explorer-result').innerHTML = '<div style="color:var(--text3);padding:20px">Aucun résultat</div>';
        return;
      }
      const { columns, values } = res[0];
      const table = `
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px">${title} <span style="font-size:11px;color:var(--text3);font-weight:400">(${values.length} lignes)</span></div>
        <table class="data-table">
          <thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${values.map(row=>`<tr>${row.map((v,i)=>{
            const col = columns[i];
            let disp = v ?? '—';
            if ((col==='ip_from'||col==='ip_to') && typeof v==='number') disp = intToIp(v);
            if (col==='country_code') disp = `${flag(v)} ${v}`;
            if (col==='nb') disp = (+v).toLocaleString();
            if (col==='proxy_type') {
              const cls = v==='TOR'?'badge-red':v==='VPN'?'badge-yellow':v==='DCH'?'badge-blue':'badge-purple';
              disp = v ? `<span class="badge ${cls}">${v}</span>` : '—';
            }
            return `<td>${disp}</td>`;
          }).join('')}</tr>`).join('')}</tbody>
        </table>`;
      document.getElementById('explorer-result').innerHTML = table;
    } catch(e) {
      document.getElementById('explorer-result').innerHTML = `<div class="error-bar">Erreur : ${e.message}</div>`;
    }
  }, 30);
}

// ── Stats ──────────────────────────────────────────────────────────────────────
function loadStats() {
  if (!DB) return;
  const statQueries = [
    ['Plages IP totales',   `SELECT COUNT(*) FROM ip_ranges`],
    ['Pays couverts',       `SELECT COUNT(DISTINCT country_code) FROM ip_ranges`],
    ['Villes indexées',     `SELECT COUNT(DISTINCT city) FROM ip_ranges`],
    ['Plages ASN',          `SELECT COUNT(*) FROM ip_asn`],
    ['Proxies / VPN / TOR', `SELECT COUNT(*) FROM ip_proxy`],
    ['TOR exit nodes',      `SELECT COUNT(*) FROM ip_proxy WHERE proxy_type='TOR'`],
    ['VPN commerciaux',     `SELECT COUNT(*) FROM ip_proxy WHERE proxy_type='VPN'`],
    ['Datacenters',         `SELECT COUNT(*) FROM ip_proxy WHERE proxy_type='DCH'`],
  ];

  let statsHtml = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px">`;
  statQueries.forEach(([label, sql]) => {
    let val = '—';
    try { val = (DB.exec(sql)[0]?.values[0][0] ?? 0).toLocaleString(); } catch {}
    statsHtml += `<div class="stat-card"><div class="sc-val">${val}</div><div class="sc-lbl">${label}</div></div>`;
  });
  statsHtml += `</div>`;

  // Top pays
  try {
    const res = DB.exec(`SELECT country_code, country_name, COUNT(*) as n FROM ip_ranges GROUP BY country_code ORDER BY n DESC LIMIT 10`);
    if (res.length) {
      const max = res[0].values[0][2];
      statsHtml += `<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase">Top 10 pays</div>`;
      statsHtml += res[0].values.map(([cc,cn,n]) => {
        const pct = Math.round(100 * n / max);
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span style="font-family:var(--font-mono);font-size:12px;min-width:200px;color:var(--text)">${flag(cc)} ${cn}</span>
          <div style="flex:1;background:var(--bg3);border-radius:3px;height:6px">
            <div style="width:${pct}%;background:var(--accent);height:100%;border-radius:3px"></div>
          </div>
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text2);min-width:60px;text-align:right">${(+n).toLocaleString()}</span>
        </div>`;
      }).join('');
    }
  } catch {}

  document.getElementById('stats-result').innerHTML = statsHtml;
}

// ── SQL ────────────────────────────────────────────────────────────────────────
function setSQLExample(k) {
  document.getElementById('sql-input').value = SQL_EXAMPLES[k] || '';
}

function runSQL() {
  if (!requireDB('sql-result')) return;
  const sql = document.getElementById('sql-input').value.trim();
  if (!sql) return;
  document.getElementById('sql-result').innerHTML = '<span class="spinner"></span>';
  setTimeout(() => {
    try {
      const t0 = performance.now();
      const res = DB.exec(sql);
      const elapsed = (performance.now() - t0).toFixed(1);
      if (!res.length) {
        document.getElementById('sql-result').innerHTML = `<div style="color:var(--green);font-size:12px">✓ Exécuté en ${elapsed}ms — aucun résultat retourné</div>`;
        return;
      }
      const { columns, values } = res[0];
      const shown = values.slice(0, 500);
      const table = `
        <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${values.length} lignes · ${elapsed}ms ${values.length>500?'(affichage limité à 500)':''}</div>
        <div style="overflow-x:auto">
        <table class="data-table">
          <thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${shown.map(row=>`<tr>${row.map((v,i)=>{
            const col = columns[i];
            let disp = v ?? '—';
            if ((col==='ip_from'||col==='ip_to') && typeof v==='number') disp = intToIp(v);
            return `<td>${String(disp).substring(0,80)}</td>`;
          }).join('')}</tr>`).join('')}</tbody>
        </table></div>`;
      document.getElementById('sql-result').innerHTML = table;
    } catch(e) {
      document.getElementById('sql-result').innerHTML = `<div class="error-bar">Erreur SQL : ${e.message}</div>`;
    }
  }, 30);
}
</script>
